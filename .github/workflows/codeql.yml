name: CodeQL

# Only a change to code either analysis reads: Go for one, the UI and any other
# JavaScript, TypeScript or HTML for the other. A change to prose or to the
# install script gave CodeQL nothing new to find and held a fleet slot for
# twenty minutes finding it. The weekly run still covers main in full, which is
# what catches a query that learnt something new about unchanged code.
on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "**.js"
      - "**.mjs"
      - "**.ts"
      - "**.html"
      - ".github/workflows/codeql.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "**.js"
      - "**.mjs"
      - "**.ts"
      - "**.html"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "11 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's analysis is replaced by a newer push and dropped when the
# pull request is closed or merged: closing starts a run that takes over the
# pull request's group, cancels the analysis still going, and skips the job.
# Main's runs and the weekly one are never cancelled. ci.yml says why.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    if: github.event.action != 'closed'
    # This organisation's fork has an 8-CPU/32-GiB PR pool for analysis.
    # Preserve upstream's hosted runner and the existing hosted fallback
    # for pull requests whose code comes from another repository.
    runs-on: ${{ github.repository == 'Vision-Elevators-Pty-Ltd/zoomies' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'zoomies-linux-x64' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        if: matrix.language == 'go'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - name: Build Go for analysis
        if: matrix.language == 'go'
        run: make build-nogui
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
